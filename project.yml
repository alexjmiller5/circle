name: Circle
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
targets:
  Circle:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [nudge/nudge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.circle
        PRODUCT_NAME: Circle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Circle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_RESOURCE_ACCESS_CONTACTS: YES
        INFOPLIST_KEY_NSContactsUsageDescription: "Circle reads a person's phone number or email from Contacts only when you start a message or call. Nothing is saved."
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Debug keeps the development identity so local builds and UI tests never
        # share the signed app's container or Keychain. Only the app takes the
        # Ad Hoc profile; sign-ios.py supplies IOS_PROFILE.
        release:
          PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.circle
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_PROFILE}
  CircleUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources: [nudge/nudgeUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.circle.uitests
    dependencies:
      - target: Circle
schemes:
  Circle:
    build:
      targets:
        Circle: all
        CircleUITests: [test]
    test:
      targets: [CircleUITests]
